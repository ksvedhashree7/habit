<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F5EE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Habits</title>
<style>
:root{--bg:#F2F5EE;--card:#fff;--ink:#273338;--mute:#5E6B66;--line:#DCE3D6;--acc:#2B5748;--g0:#E4EAE0;--g1:#9CB080;--g2:#618764;--g3:#2B5748;--g4:#273338;--warn:#C0392B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:4px 0 2px;letter-spacing:-.01em}
h2{font-size:1rem;margin:0 0 10px}
.sub{color:var(--mute);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.btn{background:var(--acc);color:#fff;border-radius:10px;padding:10px 14px;font-weight:600}
.btn.alt{background:var(--g0);color:var(--ink)}
.nav{display:flex;align-items:center;justify-content:space-between}
.nav button{font-size:1.4rem;padding:6px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.habit{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.habit:last-child{border:0}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:.15s}
.on .box{background:var(--g3);border-color:var(--g3)}
.on .box:after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.on .nm{color:var(--mute);text-decoration:line-through}
.habit .t{margin-left:auto;color:var(--mute);font-size:.8rem;white-space:nowrap}
input[type=number],input[type=text],input[type=email],input[type=password]{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
.bar{height:8px;background:var(--g0);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--g3);width:0;transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{text-align:center}.stat b{display:block;font-size:1.7rem;letter-spacing:-.02em}.stat small{color:var(--mute)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.cell{aspect-ratio:1;border-radius:3px;background:var(--g0)}
.l1{background:var(--g1)}.l2{background:var(--g2)}.l3{background:var(--g3)}.l4{background:var(--g4)}
.cell.today{outline:2px solid var(--acc);outline-offset:1px}
.legend{display:flex;gap:4px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:.75rem;color:var(--mute)}
.legend .cell{width:12px;aspect-ratio:1}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;scrollbar-width:none;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1 0 auto;padding:10px 12px;border-radius:10px;color:var(--mute);font-weight:600;font-size:.8rem}
.tabs button.act{color:var(--acc);background:var(--g0)}
.hide{display:none}
textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;resize:vertical}a{color:var(--acc);font-weight:600;margin-right:16px}summary{font-weight:700;cursor:pointer;list-style-position:inside}details.card[open] summary{margin-bottom:8px}.ol{margin:0;padding-left:20px}.ol li{margin:4px 0}
.item{display:flex;gap:8px;margin-bottom:8px}
.msg{font-size:.85rem;margin-top:8px;color:var(--mute)}
.chart{display:flex;align-items:flex-end;gap:6px;height:90px}
.chart div{flex:1;background:var(--g2);border-radius:5px 5px 0 0;min-height:2px;position:relative}
.chart small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;color:var(--mute);font-size:.7rem}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<section id="v-today">
  <div class="nav"><button id="prev" aria-label="Previous day">‹</button>
    <div style="text-align:center"><h1 id="dTitle"></h1><div class="sub" id="dSub"></div></div>
    <button id="next" aria-label="Next day">›</button></div>
  <div class="card"><h2>Habits</h2><div id="habits"></div>
    <div class="bar"><i id="hbar"></i></div><div class="sub" id="hsum" style="margin-top:6px"></div></div>
  <div class="cols">
    <div class="card"><label style="margin-top:0">Study / coding (hours)</label><input id="study" type="number" inputmode="decimal" step="0.25" min="0" max="24"><div class="bar"><i id="sbar"></i></div><div class="sub" id="sgoal" style="margin-top:6px"></div></div>
    <div class="card"><label style="margin-top:0">Steps (from watch)</label><input id="steps" type="number" inputmode="numeric" min="0" step="100"><div class="bar"><i id="tbar"></i></div><div class="sub" id="tgoal" style="margin-top:6px"></div></div>
  </div>
  <div class="card"><label style="margin-top:0">Workout / health note</label><input id="note" type="text" placeholder="e.g. 30 min run, 2L water"></div>
</section>

<section id="v-streaks" class="hide">
  <h1>Streaks</h1><div class="sub">A day counts toward your streak at 75% or more of today's targets.</div>
  <div class="card"><div class="stats"><div class="stat"><b id="cur">0</b><small>Current</small></div><div class="stat"><b id="best">0</b><small>Best</small></div><div class="stat"><b id="tot">0</b><small>Days hit</small></div></div></div>
  <div class="card"><h2>Last 20 weeks</h2><div class="heat" id="heat"></div>
    <div class="legend">Less <i class="cell"></i><i class="cell l1"></i><i class="cell l2"></i><i class="cell l3"></i><i class="cell l4"></i> More</div></div>
  <div class="card"><h2>Steps, last 7 days</h2><div class="chart" id="stepChart"></div><div style="height:20px"></div></div>
  <div class="card"><h2>Study hours, last 7 days</h2><div class="chart" id="studyChart"></div><div style="height:20px"></div></div>
</section>

<section id="v-workout" class="hide"><div id="wk"></div></section>

<section id="v-ssb" class="hide"><div id="sb"></div></section>

<section id="v-defence" class="hide"><div id="df"></div></section>

<section id="v-diet" class="hide"><div id="dt"></div></section>

<section id="v-settings" class="hide">
  <h1>Settings</h1>
  <div class="card"><h2>Habits</h2><div id="hedit"></div>
    <div class="item"><input id="newH" type="text" placeholder="New habit"><input id="newT" type="text" placeholder="Time" style="width:92px;flex:none"><button class="btn" id="addH">Add</button></div></div>
  <div class="card"><h2>Daily goals</h2>
    <label>Study hours</label><input id="gStudy" type="number" step="0.25" inputmode="decimal">
    <label>Steps</label><input id="gSteps" type="number" step="500" inputmode="numeric"></div>
  <div class="card" id="syncCard"><h2>Sync</h2><div id="syncBody"></div></div>
  <div class="card"><h2>Backup</h2><div class="row"><button class="btn alt" id="exp">Export</button><button class="btn alt" id="imp">Import</button><input type="file" id="file" accept="application/json" class="hide"></div></div>
</section>
</main>

<nav class="tabs"><button data-v="today" class="act">Today</button><button data-v="streaks">Streaks</button><button data-v="workout">Workout</button><button data-v="ssb">SSB</button><button data-v="defence">Defence</button><button data-v="diet">Diet</button><button data-v="settings">Settings</button></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" defer></script>
<script>
/* ===== Optional sync: paste your Supabase values here (see README) ===== */
const SUPABASE_URL = "";
const SUPABASE_KEY = "";
/* ======================================================================= */

const $ = id => document.getElementById(id);
const KEY = "habits.v1";
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 8);

const ROUTINE = [
  ["Wake up","4:45 AM"],["Freshen up, make bed","4:45 AM"],["Warm-up and mobility","5:00 AM"],
  ["Run / jog","5:15 AM"],["Push-ups, squats, plank","5:45 AM"],["Cooldown and stretching","6:00 AM"],
  ["Bath and get ready","6:15 AM"],["Breakfast","6:35 AM"],["Strength training / swimming","5:00 PM"],
  ["Newspaper and current affairs","6:00 PM"],["Indian defence awareness","6:30 PM"],["College studies","7:00 PM"],
  ["Dinner","8:00 PM"],["SSB preparation and reasoning","8:30 PM"],["English speaking / communication","8:50 PM"],
  ["Plan tomorrow","9:10 PM"],["Sleep","9:30 PM"]
];
const DEFAULT = () => ({
  habits: ROUTINE.map(([name, time], i) => ({id: "r" + i, name, time})),
  goals: {study: 1, steps: 8000}, days: {}, updated: 0
});
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || DEFAULT(); } catch { S = DEFAULT(); }
let cur = new Date(); cur.setHours(0,0,0,0);

const day = k => S.days[k] || (S.days[k] = {h: [], study: 0, steps: 0, note: ""});
function score(k) {
  const d = S.days[k]; if (!d) return 0;
  const hs = new Set(S.habits.map(h => h.id));
  const done = d.h.filter(i => hs.has(i)).length;
  const parts = S.habits.length + 2;
  const s = done + Math.min(1, d.study / (S.goals.study || 1)) + Math.min(1, d.steps / (S.goals.steps || 1));
  return s / parts;
}
const level = s => s >= .95 ? 4 : s >= .75 ? 3 : s >= .4 ? 2 : s > 0 ? 1 : 0;

let timer;
function save() {
  S.updated = Date.now();
  localStorage.setItem(KEY, JSON.stringify(S));
  clearTimeout(timer); timer = setTimeout(push, 1200);
}

/* ---------- Today ---------- */
function renderToday() {
  const k = iso(cur), d = day(k);
  const t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.round((cur - t) / 864e5);
  $("dTitle").textContent = diff === 0 ? "Today" : diff === -1 ? "Yesterday" : cur.toLocaleDateString(undefined, {weekday: "long"});
  $("dSub").textContent = cur.toLocaleDateString(undefined, {day: "numeric", month: "long", year: "numeric"});
  $("next").disabled = diff >= 0; $("next").style.opacity = diff >= 0 ? .3 : 1;
  $("habits").innerHTML = S.habits.length ? S.habits.map(h =>
    `<button class="habit ${d.h.includes(h.id) ? "on" : ""}" data-id="${h.id}"><i class="box"></i><span class="nm">${esc(h.name)}</span><span class="t">${esc(h.time || "")}</span></button>`).join("")
    : `<div class="sub">No habits yet. Add some in Settings.</div>`;
  const done = d.h.filter(i => S.habits.some(h => h.id === i)).length;
  $("hbar").style.width = (S.habits.length ? done / S.habits.length * 100 : 0) + "%";
  $("hsum").textContent = `${done} of ${S.habits.length} done`;
  if (document.activeElement !== $("study")) $("study").value = d.study || "";
  if (document.activeElement !== $("steps")) $("steps").value = d.steps || "";
  if (document.activeElement !== $("note")) $("note").value = d.note || "";
  bars();
}
function bars() {
  const d = day(iso(cur));
  $("sbar").style.width = Math.min(100, d.study / S.goals.study * 100) + "%";
  $("tbar").style.width = Math.min(100, d.steps / S.goals.steps * 100) + "%";
  $("sgoal").textContent = `Goal ${S.goals.study} h`;
  $("tgoal").textContent = `Goal ${S.goals.steps.toLocaleString()}`;
}
$("habits").onclick = e => {
  const b = e.target.closest(".habit"); if (!b) return;
  const d = day(iso(cur)), id = b.dataset.id;
  d.h = d.h.includes(id) ? d.h.filter(x => x !== id) : [...d.h, id];
  save(); renderToday();
};
$("study").oninput = e => { day(iso(cur)).study = Math.max(0, parseFloat(e.target.value) || 0); save(); bars(); };
$("steps").oninput = e => { day(iso(cur)).steps = Math.max(0, parseInt(e.target.value) || 0); save(); bars(); };
$("note").oninput = e => { day(iso(cur)).note = e.target.value.slice(0, 200); save(); };
$("prev").onclick = () => { cur.setDate(cur.getDate() - 1); renderToday(); };
$("next").onclick = () => { cur.setDate(cur.getDate() + 1); renderToday(); };

/* ---------- Streaks ---------- */
function renderStreaks() {
  const today = new Date(); today.setHours(0,0,0,0);
  const weeks = 20, start = new Date(today);
  start.setDate(start.getDate() - ((today.getDay() + 6) % 7) - (weeks - 1) * 7); // Monday start
  let html = "";
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (d > today) { html += `<i class="cell" style="opacity:0"></i>`; continue; }
    const k = iso(d);
    html += `<i class="cell l${level(score(k))} ${d.getTime() === today.getTime() ? "today" : ""}" title="${k}"></i>`;
  }
  $("heat").innerHTML = html;
  const keys = Object.keys(S.days).sort();
  let tot = 0, best = 0, run = 0, prev = null;
  keys.forEach(k => {
    if (score(k) >= .75) {
      tot++;
      run = prev && (new Date(k) - new Date(prev)) === 864e5 ? run + 1 : 1;
      best = Math.max(best, run); prev = k;
    }
  });
  let c = 0, d = new Date(today);
  if (score(iso(d)) < .75) d.setDate(d.getDate() - 1); // today may still be in progress
  while (score(iso(d)) >= .75) { c++; d.setDate(d.getDate() - 1); }
  $("cur").textContent = c; $("best").textContent = best; $("tot").textContent = tot;
  const mini = (id, f) => {
    const vals = [], labs = [];
    for (let i = 6; i >= 0; i--) { const x = new Date(today); x.setDate(x.getDate() - i); vals.push(f((S.days[iso(x)] || {}))); labs.push(x.toLocaleDateString(undefined, {weekday: "narrow"})); }
    const m = Math.max(...vals, 1);
    $(id).innerHTML = vals.map((v, i) => `<div style="height:${v / m * 100}%"><small>${labs[i]}</small></div>`).join("");
  };
  mini("stepChart", d => d.steps || 0); mini("studyChart", d => d.study || 0);
}

/* ---------- Settings ---------- */
function renderSettings() {
  $("hedit").innerHTML = S.habits.map(h => `<div class="item" data-id="${h.id}"><input type="text" value="${esc(h.name)}" class="hn"><input type="text" value="${esc(h.time || "")}" class="ht" placeholder="Time" style="width:92px;flex:none"><button class="btn alt hd" aria-label="Delete">✕</button></div>`).join("");
  $("gStudy").value = S.goals.study; $("gSteps").value = S.goals.steps;
  renderSync();
}
$("hedit").oninput = e => {
  const c = e.target.classList, k = c.contains("hn") ? "name" : c.contains("ht") ? "time" : null; if (!k) return;
  S.habits.find(h => h.id === e.target.parentNode.dataset.id)[k] = e.target.value; save();
};
$("hedit").onclick = e => {
  const b = e.target.closest(".hd"); if (!b) return;
  if (!confirm("Delete this habit? Past records stay saved.")) return;
  S.habits = S.habits.filter(h => h.id !== b.parentNode.dataset.id); save(); renderSettings();
};
$("addH").onclick = () => { const n = $("newH").value.trim(); if (!n) return; S.habits.push({id: uid(), name: n.slice(0, 40), time: $("newT").value.trim().slice(0, 12)}); $("newH").value = ""; $("newT").value = ""; save(); renderSettings(); };
$("gStudy").oninput = e => { S.goals.study = parseFloat(e.target.value) || 1; save(); };
$("gSteps").oninput = e => { S.goals.steps = parseInt(e.target.value) || 1; save(); };
$("exp").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], {type: "application/json"}));
  a.download = `habits-${iso(new Date())}.json`; a.click();
};
$("imp").onclick = () => $("file").click();
$("file").onchange = async e => {
  try {
    const j = JSON.parse(await e.target.files[0].text());
    if (!j.habits || !j.days || !j.goals) throw 0;
    if (confirm("Replace current data with this backup?")) { S = j; save(); renderSettings(); renderToday(); }
  } catch { alert("That file isn't a valid backup."); }
  e.target.value = "";
};

/* ---------- Sync (Supabase, optional) ---------- */
let sb = null, user = null, syncMsg = "";
function initSync() {
  if (!SUPABASE_URL || !SUPABASE_KEY || !window.supabase) return;
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  sb.auth.getSession().then(({data}) => { user = data.session ? data.session.user : null; renderSync(); pull(); });
}
function renderSync() {
  const el = $("syncBody");
  if (!SUPABASE_URL) { el.innerHTML = `<div class="sub">Sync is off. Add your Supabase details in index.html to turn it on (steps are in the README).</div>`; return; }
  if (!sb) { el.innerHTML = `<div class="sub">Sync needs a connection. Reconnect and reload.</div>`; return; }
  if (user) { el.innerHTML = `<div class="sub">Signed in as ${esc(user.email)}</div><div class="row" style="margin-top:10px"><button class="btn" id="syncNow">Sync now</button><button class="btn alt" id="out">Sign out</button></div><div class="msg">${esc(syncMsg)}</div>`;
    $("syncNow").onclick = pull; $("out").onclick = async () => { await sb.auth.signOut(); user = null; renderSync(); }; return; }
  el.innerHTML = `<label style="margin-top:0">Email</label><input id="em" type="email" autocomplete="email"><label>Password (min 8 characters)</label><input id="pw" type="password" autocomplete="current-password"><div class="row" style="margin-top:12px"><button class="btn" id="si">Sign in</button><button class="btn alt" id="su">Create account</button></div><div class="msg">${esc(syncMsg)}</div>`;
  const go = up => async () => {
    const email = $("em").value.trim(), password = $("pw").value;
    const r = up ? await sb.auth.signUp({email, password}) : await sb.auth.signInWithPassword({email, password});
    if (r.error) { syncMsg = r.error.message; return renderSync(); }
    user = r.data.session ? r.data.session.user : null;
    syncMsg = user ? "" : "Check your email to confirm, then sign in.";
    renderSync(); if (user) pull();
  };
  $("si").onclick = go(false); $("su").onclick = go(true);
}
async function pull() {
  if (!sb || !user) return;
  try {
    const {data, error} = await sb.from("tracker").select("data,updated").eq("user_id", user.id).maybeSingle();
    if (error) throw error;
    if (data && data.updated > S.updated) { S = data.data; localStorage.setItem(KEY, JSON.stringify(S)); syncMsg = "Updated from cloud."; renderAll(); }
    else if (!data || data.updated < S.updated) { await push(); syncMsg = "Saved to cloud."; }
    else syncMsg = "Up to date.";
  } catch (e) { syncMsg = "Sync failed: " + (e.message || e); }
  if (!$("v-settings").classList.contains("hide")) renderSync();
}
async function push() {
  if (!sb || !user) return;
  try { await sb.from("tracker").upsert({user_id: user.id, data: S, updated: S.updated}); } catch {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });

/* ---------- Workout plan (12 weeks, 3 phases) ---------- */
const PH = ["Foundation", "Build", "Strength"];
const PUSH = [
  ["Incline push-ups, hands on table or stairs: 3 x 8-10", "Plank on knees or toes: 3 x 20 s", "Slow negative push-ups from knees: 2 x 5"],
  ["Low incline push-ups, hands on chair or bed: 3 x 8-10", "Knee push-ups: 3 x 8", "Slow negative full push-ups (5 s down): 3 x 4"],
  ["Full push-ups: 4 x 3-5 (rest 90 s, finish extra reps from knees)", "Knee push-ups: 2 x 10", "Plank: 3 x 45 s"]
];
const PULL = [
  ["Dead hang on the bar: 4 x 15-20 s", "Scapular pulls (hang, pull shoulders down): 3 x 8", "Jump-up negatives (lower for 5 s): 3 x 3"],
  ["Dead hang: 3 x 30 s", "Jump-up negatives (lower for 5 s): 4 x 4", "Inverted rows under a sturdy table: 3 x 8"],
  ["Negative pull-ups (lower for 5-8 s): 4 x 5", "Chin-up top hold: 3 x 10 s", "Inverted rows: 3 x 10, then try 1 full pull-up"]
];
const LEGS = [
  ["Bodyweight squats: 3 x 15", "Reverse lunges: 3 x 8 each leg", "Glute bridges: 3 x 15", "Calf raises: 3 x 20"],
  ["Squats: 4 x 15", "Walking lunges: 3 x 10 each leg", "Stair step-ups: 3 x 10 each leg", "Wall sit: 3 x 30 s"],
  ["Jump squats: 4 x 10", "Walking lunges: 4 x 12 each leg", "Burpees: 3 x 6", "Wall sit: 3 x 45 s"]
];
const CORE = [
  ["Plank: 3 x 20 s", "Dead bug: 3 x 8 each side", "Bicycle crunches: 3 x 15"],
  ["Plank: 3 x 35 s", "Leg raises: 3 x 8", "Mountain climbers: 3 x 20"],
  ["Plank: 3 x 60 s", "Leg raises: 3 x 12", "Flutter kicks: 3 x 30"]
];
const RUN = {
  int: [["Jog 2 min, walk 1 min: repeat 6 times"], ["Run 3 min, jog 2 min: repeat 5 times"], ["Run fast 1 min, jog 1 min: repeat 8 times"]],
  easy: [["Easy jog or walk-jog: 15 min"], ["Easy jog at talking pace: 20 min"], ["Easy jog at talking pace: 25-30 min"]],
  long: [["Run 2 km nonstop (walk briefly if needed)"], ["Run 3 km steady"], ["Run 4 km steady"]]
};
const SCHED = {

    <div class="card"><h2>Your targets</h2><div class="cols"><div><label style="margin-top:0">Protein (g per kg)</label><input id="dGk" type="number" inputmode="decimal" step="0.1" value="${B.gkg}"></div>
      <div><label style="margin-top:0">Fiber goal (g)</label><input id="dFt" type="number" inputmode="numeric" value="${B.fiber}"></div></div>
      <div class="sub" style="margin-top:10px">Active people are often advised about 1.2 to 1.6 g of protein per kg. A dietitian can set exact targets for you.</div></div>
    <div class="card"><div class="sub">Aim for slow, steady change and enough food for your training. Defence medicals check weight for height. If you feel dizzy, very tired or your periods change, talk to a doctor.</div></div>`;
}
$("dt").onclick = e => {
  const b = e.target.closest("[data-f]"); if (!b) return;
  const d = day(iso(new Date())), f = d.f || (d.f = {});
  f[b.dataset.f] = !f[b.dataset.f]; save(); renderDiet();
};
$("dt").onchange = e => {
  const id = e.target.id, v = parseFloat(e.target.value) || 0, d = day(iso(new Date())), B = S.body, f = d.f || (d.f = {});
  if (id === "dH") B.height = v || 163;
  else if (id === "dW") d.wt = Math.max(0, Math.min(300, v));
  else if (id === "dGk") B.gkg = v || 1.2;
  else if (id === "dFt") B.fiber = v || 25;
  else if (id === "dP") f.p = Math.max(0, v);
  else if (id === "dF") f.fb = Math.max(0, v);
  else return;
  save(); renderDiet();
};

/* ---------- Tabs & boot ---------- */
function renderAll() { renderToday(); renderStreaks(); renderWork(); renderSsb(); renderDef(); renderDiet(); renderSettings(); }
document.querySelector(".tabs").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("act", x === b));
  ["today","streaks","workout","ssb","defence","diet","settings"].forEach(v => $("v-" + v).classList.toggle("hide", v !== b.dataset.v));
  if (b.dataset.v === "streaks") renderStreaks();
  if (b.dataset.v === "workout") renderWork();
  if (b.dataset.v === "ssb") renderSsb();
  if (b.dataset.v === "defence") renderDef();
  if (b.dataset.v === "diet") renderDiet();
  if (b.dataset.v === "settings") renderSettings();
  scrollTo(0, 0);
};
renderAll();
window.addEventListener("load", initSync);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
